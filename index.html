<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini AR Museum Exhibit</title>
 
    <!-- A-Frame must load first, then AR.js (AR.js depends on A-Frame) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
 
    <!-- Custom components -->
    <script>
        // ---------- Component 1: tap the ball to cycle through colours ----------
        AFRAME.registerComponent('color-changer', {
            // schema = settings the component accepts (has a default)
            schema: {
                colors: {
                    type: 'array',
                    default: ['#EF2D5E', '#FFC65D', '#4CC3D9', '#7BC8A4', '#9B59B6']
                }
            },
 
            init: function () {
                this.index = 0;
 
                this.el.addEventListener('click', () => {
                    this.index = (this.index + 1) % this.data.colors.length;
                    this.el.setAttribute('color', this.data.colors[this.index]);
                });
            }
        });
 
        // ---------- Component 2: tap the box to grow / shrink it (NEW interaction) ----------
        AFRAME.registerComponent('grow-box', {
            schema: {
                factor: { type: 'number', default: 1.4 }   // how much bigger it gets
            },
 
            init: function () {
                this.isGrown = false;
 
                this.el.addEventListener('click', () => {
                    const s = this.isGrown ? 1 : this.data.factor;
                    this.el.setAttribute('scale', s + ' ' + s + ' ' + s);
                    this.isGrown = !this.isGrown;
                });
            }
        });
 
        // ---------- Component 3: status banner (marker found / lost) ----------
        AFRAME.registerComponent('marker-status', {
            init: function () {
                const banner = document.querySelector('#status');
 
                // <a-marker> fires markerFound when the Hiro marker appears
                this.el.addEventListener('markerFound', () => {
                    banner.textContent = 'Exhibit detected - tap the box or the ball!';
                    banner.style.backgroundColor = '#218838';   // green
                });
 
                // ...and markerLost when it disappears
                this.el.addEventListener('markerLost', () => {
                    banner.textContent = 'Searching for the Hiro marker...';
                    banner.style.backgroundColor = '#C0392B';   // red
                });
            }
        });
 
        // ---------- Component 4 (debug): shows if the 3D model loaded ----------
        // You can delete this component, the #debug div and the model-debug
        // attribute once the penguin works.
        AFRAME.registerComponent('model-debug', {
            init: function () {
                const box = document.querySelector('#debug');
                box.textContent = 'Penguin: loading...';
 
                this.el.addEventListener('model-loaded', () => {
                    box.textContent = 'Penguin: LOADED OK';
                });
 
                this.el.addEventListener('model-error', () => {
                    box.textContent = 'Penguin: ERROR - file not found';
                });
            }
        });
    </script>
 
    <!-- Page styling -->
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
 
        #status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            padding: 12px 22px;
            background-color: #C0392B;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            border-radius: 8px;
            width: max-content;
            max-width: 85%;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }
 
        #debug {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 999;
            padding: 6px 10px;
            background: black;
            color: white;
            font-size: 13px;
            border-radius: 4px;
        }
    </style>
</head>
 
<body>
 
    <!-- Status banner (text and colour are changed by marker-status) -->
    <div id="status">Searching for the Hiro marker...</div>
 
    <!-- Debug box (model-debug writes into this) -->
    <div id="debug"></div>
 
    <!-- No <a-assets> block: the scene starts straight away and the model
         is loaded directly from its file path -->
    <a-scene embedded
             vr-mode-ui="enabled: false"
             arjs="sourceType: webcam; debugUIEnabled: false;">
 
        <!-- Everything inside <a-marker> is anchored to the Hiro marker -->
        <a-marker preset="hiro" marker-status>
 
            <!-- Display platform (plane lying flat) -->
            <a-plane position="0 0 0" rotation="-90 0 0"
                     width="1.8" height="1.8" color="#253746"></a-plane>
 
            <!-- Title label -->
            <a-text value="MINI AR MUSEUM"
                    position="0 1.5 0" align="center"
                    color="#FFD166" width="3"></a-text>
 
            <!-- 3D model: penguin (rotation animation) -->
            <a-entity gltf-model="url(Models/Penguin.glb)"
                      model-debug
                      position="0 0 0.15"
                      scale="0.5 0.5 0.5"
                      animation="property: rotation; to: 0 360 0;
                                 dur: 10000; easing: linear; loop: true"></a-entity>
 
            <!-- Tappable box: spins, and grows when tapped -->
            <a-box position="-0.55 0.25 -0.35"
                   width="0.4" height="0.5" depth="0.4"
                   color="#4CC3D9"
                   class="clickable"
                   grow-box
                   animation="property: rotation; to: 0 360 0;
                              dur: 5000; easing: linear; loop: true"></a-box>
 
            <!-- Tappable ball: bounces, and changes colour when tapped -->
            <a-sphere position="0.55 0.25 -0.35"
                      radius="0.22" color="#EF2D5E"
                      class="clickable"
                      color-changer
                      animation="property: position;
                                 from: 0.55 0.25 -0.35; to: 0.55 0.65 -0.35;
                                 dir: alternate; dur: 1000;
                                 easing: easeInOutQuad; loop: true"></a-sphere>
 
            <!-- Extra display shapes -->
            <a-cylinder position="-0.55 0.25 0.55"
                        radius="0.18" height="0.5" color="#FFC65D"></a-cylinder>
 
            <a-cone position="0.55 0.2 0.55"
                    radius-bottom="0.2" radius-top="0" height="0.4"
                    color="#9B59B6"></a-cone>
 
            <!-- Instruction labels (high enough that the bouncing ball won't hide them) -->
            <a-text value="TAP BOX TO GROW"
                    position="-0.55 1.05 -0.35" align="center"
                    color="#FFFFFF" width="1.5"></a-text>
 
            <a-text value="TAP BALL TO CHANGE COLOUR"
                    position="0.55 1.05 -0.35" align="center"
                    color="#FFFFFF" width="1.7"></a-text>
 
        </a-marker>
 
        <!-- Camera + tap detection (raycaster only hits class="clickable") -->
        <a-entity camera
                  cursor="rayOrigin: mouse"
                  raycaster="objects: .clickable"></a-entity>
 
    </a-scene>
 
</body>
</html>
